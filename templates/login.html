<!--
    Esta plantilla hereda la estructura principal de base.html
    (Bootstrap, navbar, mensajes flash, etc.)
-->
{% extends "base.html" %}

<!--
    Todo lo que esté dentro de block content
    se insertará en el espacio definido por base.html
-->
{% block content %}

<div class="row justify-content-center">

    <!--
        Centra el formulario y limita su ancho
    -->
    <div class="col-md-5">

        <div class="card shadow">

            <!-- Encabezado -->
            <div class="card-header bg-primary text-white">

                <h3 class="text-center">
                    Inicio de Sesión
                </h3>

            </div>

            <!-- Contenido -->
            <div class="card-body">

                <!--
                    Formulario que envía datos mediante POST
                -->
                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="usuario"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="clave"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Ingresar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
