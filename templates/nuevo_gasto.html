{% extends "base.html" %}

{% block content %}

<h2>Registrar Nuevo Gasto</h2>

<hr>

<form method="POST">

    <!-- Fecha -->

    <div class="mb-3">

        <label class="form-label">
            Fecha
        </label>

        <input
            type="date"
            name="fecha"
            class="form-control"
            required
        >

    </div>

    <!-- Descripción -->

    <div class="mb-3">

        <label class="form-label">
            Descripción
        </label>

        <input
            type="text"
            name="descripcion"
            class="form-control"
            placeholder="Ejemplo: Almuerzo, Transporte, Internet"
            required
        >

    </div>

    <!-- Monto -->

    <div class="mb-3">

        <label class="form-label">
            Monto
        </label>

        <input
            type="number"
            step="0.01"
            name="monto"
            class="form-control"
            required
        >

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Guardar Gasto

    </button>

    <a
        href="/dashboard"
        class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
