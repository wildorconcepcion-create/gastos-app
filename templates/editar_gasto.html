{% extends "base.html" %}

{% block content %}

<h2>Editar Gasto</h2>

<hr>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Fecha
        </label>

        <input
            type="date"
            name="fecha"
            value="{{ gasto.fecha }}"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Descripción
        </label>

        <input
            type="text"
            name="descripcion"
            value="{{ gasto.descripcion }}"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Monto
        </label>

        <input
            type="number"
            step="0.01"
            name="monto"
            value="{{ gasto.monto }}"
            class="form-control"
            required
        >

    </div>

    <button
        type="submit"
        class="btn btn-success">

        Actualizar

    </button>

    <a
        href="/reporte"
        class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
